name: Build XiaoZhi Mobile v0.7.0 RC

on:
  workflow_dispatch:
    inputs:
      reviewed_ref:
        description: Exact 40-character commit SHA to build for the v0.7.0 RC
        required: true
        type: string
  push:
    branches: [ main, master, 'recovery/**' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # These three steps retain the reviewed-ref and push checkout contract
      # used by the existing Alpha1 regression suite. The RC path below is
      # dispatch-only and always uses the exact reviewed_ref checkout.
      - name: Validate Alpha1 reviewed SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_ref }}
        run: |
          if [[ ! "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "reviewed_ref must be a 40-character commit SHA" >&2
            exit 1
          fi

      - name: Checkout reviewed ref for Alpha1
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_ref }}
          fetch-depth: 0

      - name: Checkout push commit
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify Alpha1 checkout SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_ref }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$REVIEWED_SHA" ]]; then
            echo "Checked out $actual_sha, expected $REVIEWED_SHA" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Kotlin CLI
        run: |
          kotlin_version='2.0.21'
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/JetBrains/kotlin/releases/download/v${kotlin_version}/kotlin-compiler-${kotlin_version}.zip" \
            --output "$RUNNER_TEMP/kotlin-compiler.zip"
          unzip -q "$RUNNER_TEMP/kotlin-compiler.zip" -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
          kotlinc -version

      - name: Frozen Source Guard
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 tools/test_v070_final_release_gate.py --stage frozen

      - name: FIX04 verified volume regression gate
        run: python3 tools/test_v065_fix04_regression_gate.py

      - name: Frozen wake guard
        run: python3 tools/test_v065_frozen_baseline.py

      - name: Historical Regression
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 tools/test_v070_final_release_gate.py --stage historical

      - name: Historical regression
        run: |
          python3 tools/test_v031_behavior.py
          python3 tools/test_v040_voice_flow.py
          python3 tools/test_v050_session.py
          python3 tools/test_v050_voice_flow.py
          python3 tools/test_v060_security.py
          python3 tools/test_v063_custom_wake_ppinyin.py
          python3 tools/test_v063_wake_error_diagnostics.py
          python3 tools/test_v064_wake_regression.py
          python3 tools/test_v064_exit_intent.py
          python3 tools/test_v064_volume_parser.py
          python3 tools/test_v064_volume_execution.py
          python3 tools/test_v064_command_prompt_flow.py
          python3 tools/test_v064_duplicate_guard.py

      - name: v0.6.5 feature regression
        run: |
          python3 tools/test_v065_capture_failure_path.py
          python3 tools/test_v065_negative_read_failure.py
          python3 tools/test_v065_release_gate.py

      - name: P0 Recovery
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 tools/test_v070_final_release_gate.py --stage p0

      - name: Alpha1 conversation session gate
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 tools/test_v070_alpha1_session_wiring.py

      - name: Alpha1 foundation gates
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 tools/test_v070_alpha1_settings_migration.py
          python3 tools/test_v070_alpha1_chat_home_contract.py

      - name: Screen Intelligence
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 tools/test_v070_final_release_gate.py --stage screen

      - name: Messaging
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 tools/test_v070_final_release_gate.py --stage messaging

      - name: Music and Video
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 tools/test_v070_final_release_gate.py --stage music-video

      - name: Extensions
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 tools/test_v070_final_release_gate.py --stage extensions

      - name: Artifacts and Image
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 tools/test_v070_final_release_gate.py --stage artifacts-image

      - name: Security
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 tools/test_v070_final_release_gate.py --stage security

      - name: Security regression
        run: |
          python3 tools/test_v060_safe_tools.py
          python3 tools/test_v060_security.py

      - name: Android Project Validation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 tools/test_v070_final_release_gate.py --stage android

      - name: Validate source tree
        run: python3 tools/validate_project.py

      - name: Fetch Offline Models
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash scripts/fetch-kws-model.sh

      - name: Fetch offline wake + ASR models
        run: bash scripts/fetch-kws-model.sh

      - name: Unit Tests
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Alpha1 focused unit tests
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Build debug APK
        if: ${{ github.event_name == 'push' }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename RC APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          mkdir -p rc-apk
          cp app/build/outputs/apk/debug/app-debug.apk \
            rc-apk/XiaoZhi-Mobile-v0.7.0-rc-debug.apk

      - name: Validate RC APK before upload
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          rc_apk="rc-apk/XiaoZhi-Mobile-v0.7.0-rc-debug.apk"
          rc_sha256="$(sha256sum "$rc_apk" | cut -d ' ' -f 1)"
          rc_size="$(stat -c '%s' "$rc_apk")"
          echo "RC_APK_SHA256=$rc_sha256" >> "$GITHUB_ENV"
          echo "RC_APK_SIZE=$rc_size" >> "$GITHUB_ENV"
          python3 tools/validate_v070_apk.py \
            --artifact-dir rc-apk \
            --expected-size "$rc_size" \
            --expected-sha256 "$rc_sha256" \
            --report "$RUNNER_TEMP/xiaozhi-v070-rc-apk-verification.json"

      - name: Upload v0.7.0 RC APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: XiaoZhi-Mobile-v0.7.0-RC-APK
          path: rc-apk/XiaoZhi-Mobile-v0.7.0-rc-debug.apk
          if-no-files-found: error

      - name: Download v0.7.0 RC APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          name: XiaoZhi-Mobile-v0.7.0-RC-APK
          path: rc-apk-downloaded

      - name: Verify downloaded v0.7.0 RC APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          cmp --silent \
            rc-apk/XiaoZhi-Mobile-v0.7.0-rc-debug.apk \
            rc-apk-downloaded/XiaoZhi-Mobile-v0.7.0-rc-debug.apk
          python3 tools/validate_v070_apk.py \
            --artifact-dir rc-apk-downloaded \
            --expected-size "$RC_APK_SIZE" \
            --expected-sha256 "$RC_APK_SHA256" \
            --report "$RUNNER_TEMP/xiaozhi-v070-rc-downloaded-verification.json"

      # Legacy v0.6.5 artifact checks remain after the v0.7.0 RC checks so the
      # historical Golden artifact contract is still exercised without being
      # confused with the RC artifact.
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk XiaoZhi-Mobile-v0.6.5-debug.apk

      - name: Rename Alpha1 APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: cp app/build/outputs/apk/debug/app-debug.apk XiaoZhi-Mobile-Alpha1-debug.apk

      - name: Upload Alpha1 APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: XiaoZhi-Mobile-Alpha1-APK
          path: XiaoZhi-Mobile-Alpha1-debug.apk
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XiaoZhi-Mobile-APK
          path: XiaoZhi-Mobile-v0.6.5-debug.apk
          if-no-files-found: error

      - name: Create deterministic APK integrity ZIP
        run: |
          python3 tools/package_v065_apk.py \
            --apk XiaoZhi-Mobile-v0.6.5-debug.apk \
            --output XiaoZhi-Mobile-v0.6.5-debug.apk.zip

      - name: Upload APK integrity ZIP
        uses: actions/upload-artifact@v4
        with:
          name: XiaoZhi-Mobile-APK-integrity
          path: XiaoZhi-Mobile-v0.6.5-debug.apk.zip
          if-no-files-found: error

      - name: Download exact APK artifact
        uses: actions/download-artifact@v4
        with:
          name: XiaoZhi-Mobile-APK
          path: artifact-verification

      - name: Download Alpha1 APK artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          name: XiaoZhi-Mobile-Alpha1-APK
          path: alpha1-artifact-verification

      - name: Verify downloaded Alpha1 APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          mkdir -p alpha1-apk-validation
          cp alpha1-artifact-verification/XiaoZhi-Mobile-Alpha1-debug.apk \
            alpha1-apk-validation/XiaoZhi-Mobile-v0.6.5-debug.apk
          cmp --silent \
            artifact-verification/XiaoZhi-Mobile-v0.6.5-debug.apk \
            alpha1-artifact-verification/XiaoZhi-Mobile-Alpha1-debug.apk
          alpha1_sha256="$(sha256sum alpha1-artifact-verification/XiaoZhi-Mobile-Alpha1-debug.apk | cut -d ' ' -f 1)"
          echo "XiaoZhi-Mobile-Alpha1-APK sha256=$alpha1_sha256"
          echo "Alpha1 downloaded APK sha256=$alpha1_sha256"
          python3 tools/validate_v065_apk.py \
            --artifact-dir alpha1-apk-validation \
            --report "$RUNNER_TEMP/xiaozhi-alpha1-apk-verification.json"

      - name: Download APK integrity ZIP
        uses: actions/download-artifact@v4
        with:
          name: XiaoZhi-Mobile-APK-integrity
          path: artifact-zip-verification

      - name: Verify downloaded artifact ZIP and APK
        run: |
          python3 tools/validate_v065_apk.py \
            --artifact-zip artifact-zip-verification/XiaoZhi-Mobile-v0.6.5-debug.apk.zip \
            --artifact-dir artifact-verification \
            --report "$RUNNER_TEMP/xiaozhi-v065-apk-verification.json"

      - name: Upload APK verification report
        uses: actions/upload-artifact@v4
        with:
          name: XiaoZhi-Mobile-APK-verification
          path: ${{ runner.temp }}/xiaozhi-v065-apk-verification.json
          if-no-files-found: error

      - name: Upload v0.7.0 RC verification report
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: XiaoZhi-Mobile-v0.7.0-RC-verification
          path: |
            ${{ runner.temp }}/xiaozhi-v070-rc-apk-verification.json
            ${{ runner.temp }}/xiaozhi-v070-rc-downloaded-verification.json
          if-no-files-found: error
