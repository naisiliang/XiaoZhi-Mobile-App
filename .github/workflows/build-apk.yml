name: Build XiaoZhi Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Frozen wake guard
        run: python3 tools/test_v065_frozen_baseline.py

      - name: Historical regression
        run: |
          python3 tools/test_v031_behavior.py
          python3 tools/test_v040_voice_flow.py
          python3 tools/test_v050_session.py
          python3 tools/test_v050_voice_flow.py
          python3 tools/test_v060_security.py
          python3 tools/test_v063_custom_wake_ppinyin.py
          python3 tools/test_v063_wake_error_diagnostics.py
          python3 tools/test_v064_wake_regression.py
          python3 tools/test_v064_exit_intent.py
          python3 tools/test_v064_volume_parser.py
          python3 tools/test_v064_volume_execution.py
          python3 tools/test_v064_command_prompt_flow.py
          python3 tools/test_v064_duplicate_guard.py

      - name: v0.6.5 feature regression
        run: python3 tools/test_v065_release_gate.py

      - name: Security regression
        run: |
          python3 tools/test_v060_safe_tools.py
          python3 tools/test_v060_security.py

      - name: Validate source tree
        run: python3 tools/validate_project.py

      - name: Fetch offline wake + ASR models
        run: bash scripts/fetch-kws-model.sh

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk XiaoZhi-Mobile-v0.6.5-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XiaoZhi-Mobile-APK
          path: XiaoZhi-Mobile-v0.6.5-debug.apk
          if-no-files-found: error

      - name: Create deterministic APK integrity ZIP
        run: |
          python3 tools/package_v065_apk.py \
            --apk XiaoZhi-Mobile-v0.6.5-debug.apk \
            --output XiaoZhi-Mobile-v0.6.5-debug.apk.zip

      - name: Upload APK integrity ZIP
        uses: actions/upload-artifact@v4
        with:
          name: XiaoZhi-Mobile-APK-integrity
          path: XiaoZhi-Mobile-v0.6.5-debug.apk.zip
          if-no-files-found: error

      - name: Download exact APK artifact
        uses: actions/download-artifact@v4
        with:
          name: XiaoZhi-Mobile-APK
          path: artifact-verification

      - name: Download APK integrity ZIP
        uses: actions/download-artifact@v4
        with:
          name: XiaoZhi-Mobile-APK-integrity
          path: artifact-zip-verification

      - name: Verify downloaded artifact ZIP and APK
        run: |
          python3 tools/validate_v065_apk.py \
            --artifact-zip artifact-zip-verification/XiaoZhi-Mobile-v0.6.5-debug.apk.zip \
            --artifact-dir artifact-verification \
            --report "$RUNNER_TEMP/xiaozhi-v065-apk-verification.json"

      - name: Upload APK verification report
        uses: actions/upload-artifact@v4
        with:
          name: XiaoZhi-Mobile-APK-verification
          path: ${{ runner.temp }}/xiaozhi-v065-apk-verification.json
          if-no-files-found: error
