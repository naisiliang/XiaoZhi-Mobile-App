name: Build XiaoZhi Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate source tree
        run: python3 tools/validate_project.py

      - name: Fetch offline wake + ASR models
        run: bash scripts/fetch-kws-model.sh

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk XiaoZhi-Mobile-v0.3.1-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: XiaoZhi-Mobile-APK
          path: XiaoZhi-Mobile-v0.3.1-debug.apk
          if-no-files-found: error
